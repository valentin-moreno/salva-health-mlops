name: Salva Health CI/CD

on:

  push:

    branches:
      - main
      - feature/**

  pull_request:

    branches:
      - main

permissions:
  contents: read

jobs:

  ci:

    name: Continuous Integration

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar linting
        run: |
          flake8 src --max-line-length=88

      - name: Ejecutar pruebas unitarias
        run: |
          pytest -v

  cd:

    name: Continuous Delivery

    runs-on: ubuntu-latest

    needs: ci

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_LOGIN_SERVER }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Definir etiqueta de la imagen
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Construir imagen Docker
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/salva-health-api:latest \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/salva-health-api:${{ env.IMAGE_TAG }} \
            .

      - name: Publicar imagen en Azure Container Registry
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/salva-health-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/salva-health-api:${{ env.IMAGE_TAG }}